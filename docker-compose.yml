services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: kgt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kgt_cockpit
      POSTGRES_USER: kgt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - kgt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kgt -d kgt_cockpit"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kgt-agent-cockpit
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kgt:${POSTGRES_PASSWORD}@postgres:5432/kgt_cockpit
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1}
    ports:
      - "8501:8501"

volumes:
  kgt_postgres_data:
